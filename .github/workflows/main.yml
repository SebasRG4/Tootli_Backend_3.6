name: Backend CI/CD & Automated QA

on:
  push:
    branches: [ "main", "feature/*", "fix/*" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME_APP: ${{ github.repository }}-app
  IMAGE_NAME_GO: ${{ github.repository }}-go
  IMAGE_NAME_AI: ${{ github.repository }}-ai

jobs:

  # ─── 1. QA Automático: Pruebas Unitarias y de Integración ────────
  test:
    name: Run Automated Tests & QA
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: tootli_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP & Extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, mysql, gd, redis
          coverage: none

      - name: Copy .env.example for Testing
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Generate App Key
        run: php artisan key:generate

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Run Database Migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: tootli_test
          DB_USERNAME: root
          DB_PASSWORD: ""
        run: php artisan migrate --force

      - name: Execute Automated Tests (PHPUnit)
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: tootli_test
          DB_USERNAME: root
          DB_PASSWORD: ""
          CACHE_DRIVER: redis
          REDIS_HOST: 127.0.0.1
        run: php artisan test

  # ─── 2. Despliegue Automático a VPS (Solo si QA pasó en rama main) ───
  deploy:
    name: Deploy to Production VPS
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          key: ${{ secrets.SSH_KEY }}
          port: 5225
          script: |
            cd /opt/tootli
            git pull origin main
            echo '${{ secrets.SSH_PASSWORD }}' | sudo -S docker compose exec -T app php artisan migrate --force
            echo '${{ secrets.SSH_PASSWORD }}' | sudo -S docker compose exec -T app php artisan optimize:clear
            echo '${{ secrets.SSH_PASSWORD }}' | sudo -S docker compose exec -T app php artisan config:cache
            echo '${{ secrets.SSH_PASSWORD }}' | sudo -S docker compose restart queue || true

