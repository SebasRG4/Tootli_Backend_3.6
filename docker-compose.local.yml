# ============================================================
#  docker-compose.local.yml — Tootli 3.6 Desarrollo Local
#
#  Uso normal:
#    docker-compose -f docker-compose.local.yml up -d
#
#  Lee credenciales de .env y sobreescribe hosts con .env.docker
#  NUNCA modifiques tu .env principal.
# ============================================================

services:

  # ─── Base de Datos MySQL 8.0 ─────────────────────────────
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tootli_local
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      TZ: America/Mexico_City
    ports:
      - "3306:3306"   # Accesible desde TablePlus / tu IDE
    volumes:
      - db_local_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ───────────────────────────────────────────────
  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "6379:6379"   # Accesible desde TablePlus / RedisInsight
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── PHP-FPM (Laravel App) ───────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    env_file:
      - .env          # 1° lee todas las credenciales (API keys, etc.)
      - .env.docker   # 2° sobreescribe solo los hosts Docker
    environment:
      TZ: America/Mexico_City
      SCOUT_QUEUE: "true"
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./docker/php/www.conf:/usr/local/etc/php-fpm.d/www.conf
      - ./go-worker/firebase-service-account.json:/app/firebase-service-account.json:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Laravel Queue Worker ────────────────────────────────
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90 --max-time=3600
    env_file:
      - .env
      - .env.docker
    environment:
      TZ: America/Mexico_City
      SCOUT_QUEUE: "true"
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./go-worker/firebase-service-account.json:/app/firebase-service-account.json:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Nginx (sin SSL, puerto 80) ──────────────────────────
  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"       # Accede en: http://localhost
    volumes:
      - .:/var/www/html
      - ./docker/nginx/local.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  # ─── Go Worker ───────────────────────────────────────────
  go_worker:
    build:
      context: ./go-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TZ: America/Mexico_City
      DB_HOST: db
      DB_PORT: "3306"
      DB_USERNAME: root
      DB_PASSWORD: ""
      DB_DATABASE: tootli_local
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      FIREBASE_SA_PATH: /app/firebase-service-account.json
    volumes:
      - ./go-worker/firebase-service-account.json:/app/firebase-service-account.json:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Tootli AI (Python FastAPI + Gemini) ─────────────────
  ai_service:
    build:
      context: ./Tootli_AI
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"   # Swagger UI en: http://localhost:8000/docs
    env_file:
      - ./Tootli_AI/.env
    volumes:
      - ./Tootli_AI:/app

  # ─── Soketi (WebSockets) ─────────────────────────────────
  soketi:
    image: 'quay.io/soketi/soketi:1.6-16-debian'
    restart: unless-stopped
    environment:
      SOKETI_DEBUG: '1'
      SOKETI_METRICS_SERVER_PORT: '9601'
      SOKETI_DEFAULT_APP_ID: 'tootli'
      SOKETI_DEFAULT_APP_KEY: 'tootli-key'
      SOKETI_DEFAULT_APP_SECRET: 'tootli-secret'
    ports:
      - '6001:6001'

  # ─── OSRM — DESACTIVADO en local ─────────────────────────
  # Requiere datos de mapa pre-procesados. Descomenta solo si lo necesitas.
  # Para activarlo: ver README sobre cómo procesar estado-de-mexico.osm.pbf
  #
  # osrm:
  #   image: osrm/osrm-backend
  #   container_name: tootli-osrm
  #   restart: unless-stopped
  #   ports:
  #     - "5000:5000"
  #   volumes:
  #     - /opt/osrm/data:/data
  #   command: osrm-routed --algorithm mld /data/estado-de-mexico.osrm

volumes:
  db_local_data:
