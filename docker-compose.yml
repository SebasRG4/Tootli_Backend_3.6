version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-multi_food_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      TZ: America/Mexico_City
    #    ports:
    #      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:alpine
    restart: always
    ports:
      - "6379:6379"

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    restart: always
    environment:
      TZ: America/Mexico_City
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /opt/tootli/go-worker/firebase-service-account.json:/app/firebase-service-account.json:ro
    depends_on:
      - db
      - redis

  web:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  ai_service:
    build:
      context: ./Tootli_AI
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./Tootli_AI/.env
    volumes:
      - ./Tootli_AI:/app

  go_worker:
    build:
      context: ./go-worker
      dockerfile: Dockerfile
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - ./go-worker/.env
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - /opt/tootli/go-worker/firebase-service-account.json:/app/firebase-service-account.json:ro
    environment:
      TZ: America/Mexico_City
    depends_on:
      - redis
      - db

  soketi:
    image: 'quay.io/soketi/soketi:1.6-16-debian'
    restart: always
    environment:
      SOKETI_DEBUG: '1'
      SOKETI_METRICS_SERVER_PORT: '9601'
      SOKETI_DEFAULT_APP_ID: 'tootli'
      SOKETI_DEFAULT_APP_KEY: 'tootli-key'
      SOKETI_DEFAULT_APP_SECRET: 'tootli-secret'
    ports:
      - '6001:6001'
      - '9601:9601'

volumes:
  db_data:
